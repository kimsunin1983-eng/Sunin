name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 연달아 올리면 앞선 빌드를 취소 (늦게 끝난 옛 빌드가 새 APK 를 덮어쓰지 않게)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LiveSubtitle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSubtitle
          path: LiveSubtitle.apk

      - name: Publish to Releases (폰에서 바로 받기용)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드
          body: 폰에서 아래 LiveSubtitle.apk 를 눌러 내려받아 설치하세요.
          files: LiveSubtitle.apk
          make_latest: true

